<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>yomuosi鯖スプラ大会｜大会への意見・質問</title>
<style>
:root{
  --navy:#102b4c;
  --blue:#69c8ef;
  --blue2:#eaf8ff;
  --line:#d7eaf4;
  --text:#18324a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#f9fdff 0%,#eef9ff 100%);
}
header{
  background:linear-gradient(135deg,#0d2948,#174a72);
  color:#fff;
  padding:28px 18px 30px;
}
.header-inner{max-width:920px;margin:auto}
.brand{font-weight:900;letter-spacing:.04em;font-size:14px;color:#9fe3ff}
h1{margin:8px 0 6px;font-size:29px;line-height:1.25}
.subtitle{margin:0;color:#d9f4ff;font-size:14px}
main{max-width:820px;margin:auto;padding:24px 16px 48px}
.notice{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:18px 18px;margin-bottom:18px;box-shadow:0 8px 24px #1d58700d;
}
.notice-title{font-weight:900;color:var(--navy);margin-bottom:7px}
.notice p{margin:0;font-size:14px;line-height:1.8}
.form-card{
  background:#fff;border:1px solid var(--line);border-radius:22px;
  padding:22px;box-shadow:0 12px 30px #1d587012;
}
label{display:block;font-weight:800;color:var(--navy);font-size:14px;margin:18px 0 8px}
label:first-child{margin-top:0}
input,select,textarea{
  width:100%;border:1px solid #c8deea;border-radius:12px;
  padding:13px 14px;font:inherit;color:var(--text);background:#fbfeff;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:#55bce8;box-shadow:0 0 0 3px #55bce820;
}
textarea{min-height:170px;resize:vertical}
.small{font-size:12px;color:#6d8496;margin-top:6px}
button{
  width:100%;border:0;border-radius:14px;padding:14px;margin-top:22px;
  background:linear-gradient(135deg,#43b9ea,#207db8);color:#fff;
  font-weight:900;font-size:15px;cursor:pointer;
  box-shadow:0 8px 18px #207db82b;
}
button:hover{filter:brightness(1.04)}
.footer-note{
  text-align:center;color:#7890a0;font-size:12px;line-height:1.7;margin-top:18px
}
.back{
  display:inline-block;margin-bottom:15px;text-decoration:none;color:#2176a8;
  font-size:13px;font-weight:800
}
@media(max-width:520px){
  h1{font-size:25px}
  .form-card{padding:18px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">YOMUOSI SPLATOON TOURNAMENT</div>
    <h1>💬 大会への意見・質問</h1>
    <p class="subtitle">大会についての意見・質問・問題報告を運営へ送れます。</p>
  </div>
</header>

<main>
  <a class="back" href="index.html">← ホームへ戻る</a>

  <section class="notice">
    <div class="notice-title">📝 大会運営への窓口</div>
    <p>
      「このルールを変えてほしい！」<br>
      「大会について質問したい！」<br>
      「大会中に問題があった！」など、気軽に送ってください。
    </p>
  </section>

  <section class="form-card">
    <form action="https://formspree.io/f/xrpbavgn" method="POST">
      <label for="name">👤 お名前</label>
      <input id="name" name="name" type="text" placeholder="例：ぴくみん">

      <label for="type">📂 内容の種類</label>
      <select id="type" name="type">
        <option>💡 大会への意見</option>
        <option>❓ 質問</option>
        <option>🐛 問題・トラブル報告</option>
        <option>📜 ルールの提供</option>
        <option>💭 その他</option>
      </select>

      <label for="message">💬 内容</label>
      <textarea id="message" name="message" placeholder="大会について伝えたいことを入力してください"></textarea>
      <div class="small">※送信すると大会運営へ内容が送信されます。</div>

      <button type="submit">📤 送信する</button>
    </form>
  </section>

  <div class="footer-note">
    送信された内容は大会運営の確認・対応のために使用します。<br>
    他の参加者を傷つける内容や、大会と関係のない内容の送信はご遠慮ください。
  </div>
</main>
</body>
</html>
